                    <text x="154" y="133" text-anchor="middle" font-size="8.2" font-weight="700" fill="#ffffff">Админ. корпус (Д)</text>
                    <text x="154" y="145" text-anchor="middle" font-size="7.6" fill="#e7f0f2">284,05 м²</text>
                    <text x="158" y="109" text-anchor="middle" font-size="7.5" font-weight="700" fill="#245b68">
                      Вместо медпункта — Админ. корпус
                    </text>
                  </g>

                  <!-- Middle Block: Block 1 (Litera A, 2 floors) moved to middle -->
                  <g
                   
                   
                   
                   
                   
                  >
