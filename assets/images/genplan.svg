                    <text x="173" y="183" text-anchor="middle" font-size="8.5" font-weight="700" fill="#ffffff">(А)</text>
                    <text x="173" y="195" text-anchor="middle" font-size="7.2" fill="#dbe6f2">453,8 м²</text>
                    <text x="118" y="174" text-anchor="middle" font-size="7.3" font-weight="700" fill="#1b324b">Медпункт+ЛФК</text>
                    <text x="118" y="186" text-anchor="middle" font-size="7.3" font-weight="700" fill="#1b324b">2 эт: Муж. (20)</text>
