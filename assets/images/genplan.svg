                    <rect x="376" y="306" width="36" height="38" rx="2" fill="#b45a3c" stroke="#5e2918" stroke-width="1.4"/>
                    <text x="394" y="329" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">6Ж</text>
                    <rect x="418" y="306" width="36" height="38" rx="2" fill="#b45a3c" stroke="#5e2918" stroke-width="1.4"/>
                    <text x="436" y="329" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">7Ж</text>
                    <rect x="460" y="306" width="36" height="38" rx="2" fill="#b45a3c" stroke="#5e2918" stroke-width="1.4"/>
                    <text x="478" y="329" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">8Ж</text>
                    <rect x="502" y="306" width="36" height="38" rx="2" fill="#b45a3c" stroke="#5e2918" stroke-width="1.4"/>
                    <text x="520" y="329" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">9Ж</text>
                    <rect x="544" y="306" width="36" height="38" rx="2" fill="#b45a3c" stroke="#5e2918" stroke-width="1.4"/>
                    <text x="562" y="329" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">10Ж</text>
                    <text x="479" y="362" text-anchor="middle" font-size="9.5" font-weight="700" fill="#702f1a">
