                  >
                    <rect x="122" y="566" width="246" height="90" rx="4" fill="#eef4ed" stroke="#4b7f52" stroke-width="1.5" stroke-dasharray="5 3"/>
                    <rect x="136" y="584" width="96" height="24" rx="2" fill="#4b7f52" stroke="#2d5232" stroke-width="1.2"/>
                    <text x="184" y="600" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">ТЕПЛИЦА №1</text>
                    <rect x="136" y="616" width="96" height="24" rx="2" fill="#4b7f52" stroke="#2d5232" stroke-width="1.2"/>
