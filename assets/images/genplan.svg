<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" width="680" height="820" font-family="PT Sans, Arial, Helvetica, sans-serif">
                <title>Генеральный план модернизации Покровского СПССУ (Масштаб 1:1000)</title>
                <defs>
                  <pattern id="grid-10m" width="24" height="24" patternUnits="userSpaceOnUse">
                    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ebe7dc" stroke-width="0.7"/>
                  </pattern>
                </defs>

                <rect width="680" height="820" fill="#fbfaf7"/>
                <rect width="680" height="820" fill="url(#grid-10m)"/>

                <!-- Land Parcel Polygon -->
                <path
                  d="M 72,66 L 315,66 L 315,94 L 353,94 L 353,66 L 609,66 L 601,394 L 366,394 L 366,556 L 402,556 L 395,768 L 104,768 Z"
                  fill="#ffffff"
                  stroke="#121619"
                  stroke-width="2.4"
                />

                <!-- Northeast Free Sector Highlight -->
                <path
                  d="M 358,128 L 598,128 L 594,386 L 366,386 Z"
                  fill="#f7f4ee"
                  stroke="#b8ab99"
                  stroke-width="1.2"
                  stroke-dasharray="5 4"
                />
                <text x="480" y="144" text-anchor="middle" font-size="9.5" font-weight="700" fill="#646e78">
                  СВОБОДНЫЙ СЕКТОР 107 × 137 м (~1,4 га)
                </text>

                <!-- Perimeter Dimensions -->
                <text x="193" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#434c54">101,5 м</text>
                <text x="334" y="54" text-anchor="middle" font-size="10" font-weight="700" fill="#245b68">Въезд 15,7 м</text>
                <text x="481" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#434c54">107,0 м (до угла В)</text>
                <text x="624" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#434c54" transform="rotate(90 624 232)">137,0 м (В → Г)</text>
                <text x="485" y="412" text-anchor="middle" font-size="11" font-weight="700" fill="#434c54">99,5 м (Г → Д)</text>
                <text x="381" y="482" text-anchor="middle" font-size="10.5" font-weight="700" fill="#434c54" transform="rotate(90 381 482)">68,0 м</text>
                <text x="385" y="548" text-anchor="middle" font-size="9.5" font-weight="700" fill="#434c54">15,0 м</text>
                <text x="415" y="664" text-anchor="middle" font-size="10.5" font-weight="700" fill="#434c54" transform="rotate(90 415 664)">106,0 м (до угла Е)</text>
                <text x="250" y="786" text-anchor="middle" font-size="11" font-weight="700" fill="#434c54">100,7 м (Южная граница А — Е)</text>
                <text x="52" y="418" text-anchor="middle" font-size="11.5" font-weight="700" fill="#434c54" transform="rotate(-90 52 418)">293,0 м (Западная граница)</text>

                <!-- Corner Letters -->
                <text x="90" y="782" font-size="11" font-weight="700" fill="#121619">А</text>
                <text x="403" y="782" font-size="11" font-weight="700" fill="#121619">Е</text>
                <text x="614" y="68" font-size="11" font-weight="700" fill="#121619">В</text>
                <text x="608" y="401" font-size="11" font-weight="700" fill="#121619">Г</text>
                <text x="372" y="388" font-size="11" font-weight="700" fill="#121619">Д</text>

                <!-- Compass -->
