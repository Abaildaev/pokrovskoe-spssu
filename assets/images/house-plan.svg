<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" font-family="PT Sans, Arial, Helvetica, sans-serif">
                      <title>CAD-план типового дома (95,0 м²)</title>
                      <rect width="640" height="460" fill="#ffffff"/>

                      <!-- CAD Structural Axes & Dimension Lines -->
                      <g stroke="#b8c2cc" stroke-width="0.9" stroke-dasharray="6 4" aria-hidden="true">
                        <line x1="65" y1="32" x2="65" y2="410"/>
                        <line x1="235" y1="32" x2="235" y2="195"/>
                        <line x1="405" y1="32" x2="405" y2="195"/>
                        <line x1="575" y1="32" x2="575" y2="395"/>
                        <line x1="42" y1="54" x2="600" y2="54"/>
                        <line x1="42" y1="336" x2="600" y2="336"/>
                      </g>
                      <!-- Axis Bubbles -->
                      <g font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#434c54" text-anchor="middle" aria-hidden="true">
                        <circle cx="65" cy="20" r="10" fill="#ffffff" stroke="#434c54"/><text x="65" y="23">1</text>
                        <circle cx="235" cy="20" r="10" fill="#ffffff" stroke="#434c54"/><text x="235" y="23">2</text>
                        <circle cx="405" cy="20" r="10" fill="#ffffff" stroke="#434c54"/><text x="405" y="23">3</text>
                        <circle cx="575" cy="20" r="10" fill="#ffffff" stroke="#434c54"/><text x="575" y="23">4</text>
                        <circle cx="24" cy="54" r="10" fill="#ffffff" stroke="#434c54"/><text x="24" y="57">Б</text>
                        <circle cx="24" cy="336" r="10" fill="#ffffff" stroke="#434c54"/><text x="24" y="339">А</text>
                        <!-- Dimension bar -->
                        <line x1="65" y1="38" x2="575" y2="38" stroke="#646e78" stroke-width="0.9"/>
                        <rect x="292" y="31" width="56" height="12" fill="#ffffff"/>
                        <text x="320" y="40" font-size="8.5">11 500</text>
                        <line x1="606" y1="54" x2="606" y2="336" stroke="#646e78" stroke-width="0.9"/>
                        <text x="616" y="196" font-size="8.5" transform="rotate(90 616 196)">8 500</text>
                      </g>

                      <!-- Outer Double-Wall Shell -->
                      <rect x="65" y="54" width="510" height="282" fill="#ffffff" stroke="#121619" stroke-width="5"/>

                      <!-- 1. Bedroom 1 (Top Left, 14.5 m²) -->
                      <g>
                        <rect x="68" y="57" width="167" height="128" fill="#eef3f8" stroke="#434c54" stroke-width="1.8"/>
                        <rect x="82" y="65" width="38" height="50" fill="#ffffff" stroke="#1b324b" stroke-width="1.2"/>
                        <rect x="86" y="69" width="30" height="12" fill="#d9e4ef" stroke="none"/>
                        <rect x="182" y="65" width="38" height="50" fill="#ffffff" stroke="#1b324b" stroke-width="1.2"/>
                        <rect x="186" y="69" width="30" height="12" fill="#d9e4ef" stroke="none"/>
                        <rect x="132" y="65" width="38" height="16" fill="#ffffff" stroke="#646e78" stroke-width="1"/>
                        <text x="151" y="142" text-anchor="middle" font-size="10.2" font-weight="700" fill="#121619">1. Спальня №1</text>
                        <text x="151" y="158" text-anchor="middle" font-size="9" fill="#434c54">14,5 м² · 2 чел.</text>
                      </g>

                      <!-- 2. Bedroom 2 (Top Center, 14.5 m²) -->
                      <g>
                        <rect x="235" y="57" width="170" height="128" fill="#eef3f8" stroke="#434c54" stroke-width="1.8"/>
                        <rect x="250" y="65" width="38" height="50" fill="#ffffff" stroke="#1b324b" stroke-width="1.2"/>
                        <rect x="254" y="69" width="30" height="12" fill="#d9e4ef" stroke="none"/>
                        <rect x="352" y="65" width="38" height="50" fill="#ffffff" stroke="#1b324b" stroke-width="1.2"/>
                        <rect x="356" y="69" width="30" height="12" fill="#d9e4ef" stroke="none"/>
                        <rect x="301" y="65" width="38" height="16" fill="#ffffff" stroke="#646e78" stroke-width="1"/>
                        <text x="320" y="142" text-anchor="middle" font-size="10.2" font-weight="700" fill="#121619">2. Спальня №2</text>
                        <text x="320" y="158" text-anchor="middle" font-size="9" fill="#434c54">14,5 м² · 2 чел.</text>
                      </g>

                      <!-- 3. Bedroom 3 (Top Right, 14.5 m²) -->
                      <g>
                        <rect x="405" y="57" width="167" height="128" fill="#eef3f8" stroke="#434c54" stroke-width="1.8"/>
                        <rect x="419" y="65" width="38" height="50" fill="#ffffff" stroke="#1b324b" stroke-width="1.2"/>
                        <rect x="423" y="69" width="30" height="12" fill="#d9e4ef" stroke="none"/>
                        <rect x="519" y="65" width="38" height="50" fill="#ffffff" stroke="#1b324b" stroke-width="1.2"/>
                        <rect x="523" y="69" width="30" height="12" fill="#d9e4ef" stroke="none"/>
                        <rect x="469" y="65" width="38" height="16" fill="#ffffff" stroke="#646e78" stroke-width="1"/>
                        <text x="488" y="142" text-anchor="middle" font-size="10.2" font-weight="700" fill="#121619">3. Спальня №3</text>
                        <text x="488" y="158" text-anchor="middle" font-size="9" fill="#434c54">14,5 м² · 2 чел.</text>
                      </g>

                      <!-- 4. Living Hall (Bottom Center, 24.0 m², wraps around Bath 2) -->
                      <g>
                        <path
                          d="M 192,185 L 448,185 L 448,257 L 358,257 L 358,333 L 192,333 Z"
                          fill="#faf4f1"
                          stroke="#434c54"
                          stroke-width="1.8"
                        />
                        <text x="318" y="212" text-anchor="middle" font-size="10.5" font-weight="700" fill="#82361d">4. Общий зал-гостиная</text>
                        <text x="318" y="228" text-anchor="middle" font-size="9" fill="#434c54">24,0 м² · Диванная группа и ТВ</text>
                        <rect x="216" y="266" width="118" height="44" fill="#ffffff" stroke="#9e472a" stroke-width="1.3"/>
                        <text x="275" y="292" text-anchor="middle" font-size="8.8" font-weight="700" fill="#82361d">Стол на 6–8 чел.</text>
                      </g>

                      <!-- 6 & 7. Two Accessible Bathrooms (Bath 1: 4.5 m² + Bath 2: 4.0 m² = 8.5 m²) -->
                      <g>
                        <rect x="68" y="185" width="124" height="72" fill="#e7f0f2" stroke="#434c54" stroke-width="1.8"/>
                        <text x="130" y="215" text-anchor="middle" font-size="9.5" font-weight="700" fill="#245b68">6. Санузел №1</text>
                        <text x="130" y="232" text-anchor="middle" font-size="8.6" fill="#434c54">4,5 м² · Душ, трап</text>

                        <rect x="358" y="257" width="90" height="76" fill="#e7f0f2" stroke="#434c54" stroke-width="1.8"/>
                        <text x="403" y="290" text-anchor="middle" font-size="9.2" font-weight="700" fill="#245b68">7. Санузел №2</text>
                        <text x="403" y="307" text-anchor="middle" font-size="8.4" fill="#434c54">4,0 м² · Стир.</text>
                      </g>

                      <!-- 8. Entry Vestibule (Bottom Left, 7.5 m²) -->
                      <g>
                        <rect x="68" y="257" width="124" height="76" fill="#f3f1ec" stroke="#434c54" stroke-width="1.8"/>
                        <path d="M 118,333 L 118,310 A 23,23 0 0,1 141,333" fill="none" stroke="#646e78" stroke-width="1"/>
                        <text x="130" y="286" text-anchor="middle" font-size="9.8" font-weight="700" fill="#121619">8. Прихожая</text>
                        <text x="130" y="302" text-anchor="middle" font-size="8.6" fill="#434c54">7,5 м² · Кнопка вызова</text>
                      </g>

                      <!-- 5. Family Kitchen (Bottom Right, 11.5 m²) -->
                      <g>
                        <rect x="448" y="185" width="124" height="148" fill="#f7efe0" stroke="#434c54" stroke-width="1.8"/>
                        <text x="510" y="214" text-anchor="middle" font-size="10.2" font-weight="700" fill="#70490d">5. Кухня</text>
                        <text x="510" y="230" text-anchor="middle" font-size="9" fill="#434c54">11,5 м²</text>
                        <rect x="520" y="252" width="46" height="72" fill="#ffffff" stroke="#8a5b14" stroke-width="1.2"/>
                        <circle cx="536" cy="276" r="4.2" fill="#9e472a"/>
                        <circle cx="551" cy="276" r="4.2" fill="#9e472a"/>
                        <text x="484" y="290" text-anchor="middle" font-size="8.5" font-weight="700" fill="#70490d">Индукция</text>
                      </g>

                      <!-- Covered Terrace + Barrier-Free Ramp (8.0 m²) -->
                      <g>
                        <rect x="68" y="336" width="184" height="58" fill="#f3ece4" stroke="#843920" stroke-width="1.8" stroke-dasharray="6 3"/>
                        <polygon points="122,394 190,394 200,434 112,434" fill="#e1ddd3" stroke="#434c54" stroke-width="1.4"/>
                        <text x="160" y="369" text-anchor="middle" font-size="9.5" font-weight="700" fill="#702f1a">Крытая терраса (8,0 м²)</text>
                        <text x="156" y="418" text-anchor="middle" font-size="8.6" font-weight="700" fill="#121619">Пандус 1:20</text>
                      </g>
                    </svg>
